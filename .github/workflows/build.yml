name: Build Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted
          unzip -q intruder-snap.zip -d extracted

      - name: Build APK with Gradle
        run: |
          # العثور على مكان ملف gradlew والانتقال إليه تلقائياً
          PROJECT_DIR=$(dirname $(find extracted -name "gradlew" | head -n 1))
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          
