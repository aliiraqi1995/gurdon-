name: Build Web to APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted
          unzip -q intruder-snap.zip -d extracted

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies and Build Web
        run: |
          # العثور على المجلد الذي يحتوي على package.json والانتقال إليه
          PKG_PATH=$(dirname $(find extracted -name "package.json" | head -n 1))
          cd "$PKG_PATH"
          npm install
          npm run build || npx vite build || echo "No build script, continuing..."

      - name: Create Dummy Android Wrapper (Cordova/Capacitor or simple WebView)
        run: |
          echo "تم تجهيز ملفات الويب بنجاح. يمكنك استخدام أدوات مثل Cordova أو Bubblewrap لتحويلها إلى APK كامل."
