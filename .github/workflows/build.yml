name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Check and Prepare Project Files
      run: |
        # إذا كانت الملفات داخل مجلد فرعي انقلها للمسار الرئيسي
        if [ -d "LockGuard-Android13" ] && [ ! -f "settings.gradle.kts" ]; then
          cp -r LockGuard-Android13/* .
          cp -r LockGuard-Android13/.* . 2>/dev/null || true
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Using system gradle..."
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LockGuard-Android-APK
        path: app/build/outputs/apk/debug/app-debug.apk
