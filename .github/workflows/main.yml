name: Unzip and Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          # استبدل project.zip باسم ملفك المضغوط الفعلي إذا كان مختلفاً
          unzip -q project.zip -d extracted_project
          cd extracted_project
          # إذا كان الملف المضغوط يحتوي على مجلد داخلي، نتحرك داخله
          # (يمكنك تعديل اسم المجلد الناتج إذا لزم الأمر)

      - name: Build Debug APK
        run: |
          cd extracted_project
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
          
